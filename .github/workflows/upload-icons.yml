name: Upload icônes Lucide

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: |
          npm install
          npm install --no-save lucide-static

      - name: Upload des icônes (emojis d'application)
        env:
          TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node scripts/upload-icons.js node_modules/lucide-static/icons

      - name: Commit du mapping
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add src/data/icons-map.json
          git diff --cached --quiet || git commit -m "Update icons-map.json"
          git push
